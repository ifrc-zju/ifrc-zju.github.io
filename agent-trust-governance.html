<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 可信基础设施：场景—技术—治理三位一体 | 浙江大学滨江研究院数智融合研究中心</title>
  <script src="topology-i18n.js"></script>
  <script src="patents-data.js"></script>
  <style>
    :root {
      --bg-deep: #020508;
      --cy: #00ffff;
      --pu: #e066ff;
      --gn: #00ffb8;
      --amb: #ffdd57;
      --text: #ffffff;
      --text-dim: #d4e6ff;
      --text-sub: #ecf4ff;
      --text-muted: #c8daf5;
      --card-paper-bg: #071428;
      --card-standard-bg: #1c1606;
      --card-patent-bg: #140a28;
      --topology-card-h: 138px;
      --topology-card-pad: 11px 12px 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 17px;
      color: var(--text);
      background: radial-gradient(ellipse 100% 70% at 50% 0%, #0c1a3d 0%, var(--bg-deep) 50%, #020308 100%);
      overflow-x: auto;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
      background-image:
        radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.35) 50%, transparent 51%),
        radial-gradient(1px 1px at 78% 42%, rgba(0,229,255,0.35) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 44% 76%, rgba(191,0,255,0.3) 50%, transparent 51%);
      animation: twinkle 10s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      to { opacity: 1; filter: brightness(1.12); }
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1720px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    header { text-align: center; margin-bottom: 1.25rem; }
    header h1 {
      font-size: clamp(1.35rem, 3.2vw, 2.15rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(92deg, var(--cy), var(--pu), var(--gn));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    header .sub {
      margin-top: 0.5rem;
      font-size: 1rem;
      line-height: 1.65;
      color: var(--text-dim);
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem 2rem;
      margin: 1rem 0 1.25rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-sub);
    }
    .legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .legend i { width: 22px; height: 3px; border-radius: 2px; display: inline-block; }
    .legend .l-stack { background: linear-gradient(90deg, var(--cy), var(--pu)); box-shadow: 0 0 8px var(--cy); }
    .legend .l-gov { background: linear-gradient(90deg, transparent, var(--gn)); box-shadow: 0 0 6px var(--gn); }
    .legend .l-paper {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--cy); box-shadow: 0 0 8px var(--cy);
    }
    .legend .l-standard {
      width: 10px; height: 10px; border-radius: 2px;
      background: linear-gradient(135deg, #ffc857, #e8a830);
      box-shadow: 0 0 8px rgba(255, 200, 87, 0.55);
    }
    .legend .l-patent {
      width: 10px; height: 10px; border-radius: 2px;
      background: linear-gradient(135deg, #c77dff, #9b4dff);
      box-shadow: 0 0 8px rgba(191, 0, 255, 0.45);
    }

    .intel-pill {
      box-sizing: border-box;
      padding: 8px 12px;
      text-align: center;
      font-size: 14.5px;
      line-height: 1.35;
      font-weight: 800;
      color: #ffffff;
      background: #0a1838;
      border: 2px solid rgba(0, 255, 255, 0.65);
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.2);
    }

    .mega-wrap {
      position: relative;
      width: 100%;
      border-radius: 18px;
      border: 2px solid rgba(0, 255, 255, 0.45);
      box-shadow: 0 0 32px rgba(0, 255, 255, 0.12), inset 0 0 60px rgba(0, 0, 0, 0.35);
      background: rgba(2, 8, 20, 0.92);
      overflow: visible;
    }
    .mega-wrap svg.graph-svg {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: top;
    }

    .cap-card {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 10px 14px;
      font-size: 15.5px;
      line-height: 1.5;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #d8eeff;
      background: rgba(4, 14, 32, 0.9);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 10px;
    }
    .cap-card.layer-tech { border-color: rgba(191, 0, 255, 0.4); color: #f0e6ff; }
    .cap-card.layer-proto { border-color: rgba(255, 200, 87, 0.45); color: #fff4dc; }
    .cap-card.layer-gov { border-color: rgba(0, 255, 163, 0.42); color: #e4fff4; }

    /* 层标题区：副标题 + ①②③ 紧凑并入，不单独占行 */
    .layer-head {
      box-sizing: border-box;
      width: 100%;
      text-align: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 4px 8px 2px;
    }
    .layer-head-title {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.28;
    }
    .layer-head-scene .layer-head-title { color: #00ffff; text-shadow: 0 0 18px rgba(0, 255, 255, 0.35); }
    .layer-head-tech .layer-head-title { color: #f0b0ff; text-shadow: 0 0 18px rgba(224, 102, 255, 0.35); }
    .layer-head-proto .layer-head-title { color: #ffdd57; text-shadow: 0 0 18px rgba(255, 221, 87, 0.35); }
    .layer-head-gov .layer-head-title { color: #00ffb8; text-shadow: 0 0 18px rgba(0, 255, 184, 0.35); }
    .layer-head-body {
      margin: 6px 0 0;
      font-size: 13.5px;
      line-height: 1.48;
      font-weight: 500;
      color: var(--text-sub);
    }
    .layer-head-lead::after {
      content: ' · ';
      opacity: 0.8;
    }
    .lh-item {
      display: inline;
    }
    .lh-item + .lh-item::before {
      content: ' · ';
      opacity: 0.75;
    }
    .cap-line-num {
      font-weight: 800;
      margin-right: 0.12em;
    }
    .layer-head-scene .cap-line-num { color: #00ffff; }
    .layer-head-tech .cap-line-num { color: #f0b0ff; }
    .layer-head-proto .cap-line-num { color: #ffdd57; }
    .layer-head-gov .cap-line-num { color: #00ffb8; }

    .topology-card-slot {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }
    .paper-badge-wrap {
      position: relative;
      width: 100%;
      max-width: 100%;
      height: 100%;
      min-height: var(--topology-card-h);
      display: flex;
      flex-direction: column;
      z-index: 1;
    }
    .axis-paper-block,
    .axis-standard-block,
    .axis-patent-block {
      box-sizing: border-box;
      flex: 1 1 auto;
      width: 100%;
      max-width: 100%;
      height: var(--topology-card-h);
      min-height: var(--topology-card-h);
      max-height: var(--topology-card-h);
      padding: var(--topology-card-pad);
      font-size: 13px;
      line-height: 1.48;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .axis-paper-block {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #f0f8ff;
      background: var(--card-paper-bg);
      border: 2px solid rgba(0, 255, 255, 0.72);
      border-radius: 9px;
      cursor: default;
      word-break: break-word;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.18);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .axis-paper-block:hover {
      border-color: rgba(224, 102, 255, 0.9);
      box-shadow: 0 0 16px rgba(224, 102, 255, 0.35);
      transform: translateY(-0.5px);
    }
    .axis-paper-block .pv {
      color: #00ffb8;
      font-weight: 800;
      font-size: 11.5px;
      display: block;
      margin-bottom: 3px;
      letter-spacing: 0.02em;
    }
    .axis-paper-block .paper-title,
    .axis-standard-block .st-name,
    .axis-patent-block .pt-name {
      flex: 1 1 auto;
      min-height: 0;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.42;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .axis-paper-block .paper-title { color: #ffffff; }
    .topology-card-footer {
      flex: 0 0 auto;
      min-height: 2.5em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: auto;
      padding-top: 4px;
    }
    .axis-paper-block .paper-brief {
      border-top: 1px solid rgba(0, 255, 255, 0.42);
      font-size: 11.5px;
      line-height: 1.44;
      color: var(--text-muted);
      font-weight: 600;
    }
    .axis-paper-block.layer-tech .paper-brief { border-top-color: rgba(224, 102, 255, 0.45); color: #e8d4ff; }
    .axis-paper-block.layer-proto .paper-brief { border-top-color: rgba(255, 221, 87, 0.45); color: #ffe9a8; }
    .axis-paper-block.layer-gov .paper-brief { border-top-color: rgba(0, 255, 184, 0.45); color: #b8ffe8; }
    .axis-paper-block.layer-tech { border-color: rgba(224, 102, 255, 0.72); color: #faf0ff; }
    .axis-paper-block.layer-tech .pv { color: #f0b0ff; }
    .axis-paper-block.layer-proto { border-color: rgba(255, 221, 87, 0.72); color: #fff8e8; }
    .axis-paper-block.layer-proto .pv { color: #ffdd57; }
    .axis-paper-block.layer-gov { border-color: rgba(0, 255, 184, 0.72); color: #f0fff8; }
    .axis-paper-block.layer-gov .pv { color: #00ffb8; }

    .axis-standard-block {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff8e8;
      background: var(--card-standard-bg);
      border: 2px solid rgba(255, 221, 87, 0.75);
      border-radius: 9px;
      cursor: default;
      word-break: break-word;
      box-shadow: 0 0 10px rgba(255, 221, 87, 0.18);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .axis-standard-block:hover {
      border-color: rgba(255, 235, 120, 0.95);
      box-shadow: 0 0 16px rgba(255, 221, 87, 0.35);
      transform: translateY(-0.5px);
    }
    .axis-standard-block .st-meta {
      display: block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 3px;
      color: #ffdd57;
    }
    .axis-standard-block .st-meta .st-status { font-weight: 800; }
    .axis-standard-block .st-meta .st-pub { color: #00ffb8; }
    .axis-standard-block .st-meta .st-draft { color: #88ccff; }
    .axis-standard-block .st-meta .st-consult { color: #ffcc66; }
    .axis-standard-block .st-meta .st-pending { color: #d8e4f8; }
    .axis-standard-block .st-name { color: #ffffff; }
    .axis-standard-block .st-partner {
      border-top: 1px solid rgba(255, 221, 87, 0.42);
      font-size: 11.5px;
      line-height: 1.42;
      color: var(--text-muted);
      font-weight: 600;
    }
    .axis-standard-block.layer-tech { border-color: rgba(224, 102, 255, 0.72); }
    .axis-standard-block.layer-tech .st-meta { color: #f0b0ff; }
    .axis-standard-block.layer-proto { border-color: rgba(255, 221, 87, 0.75); }
    .axis-standard-block.layer-gov { border-color: rgba(0, 255, 184, 0.72); }
    .axis-standard-block.layer-gov .st-meta { color: #00ffb8; }

    .axis-patent-block {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #faf0ff;
      background: var(--card-patent-bg);
      border: 2px solid rgba(224, 102, 255, 0.75);
      border-radius: 9px;
      cursor: default;
      word-break: break-word;
      box-shadow: 0 0 10px rgba(224, 102, 255, 0.2);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .axis-patent-block:hover {
      border-color: rgba(240, 140, 255, 0.95);
      box-shadow: 0 0 16px rgba(224, 102, 255, 0.38);
      transform: translateY(-0.5px);
    }
    .axis-patent-block .pt-meta {
      display: block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 3px;
      color: #f0b0ff;
    }
    .axis-patent-block .pt-meta .pt-status { font-weight: 800; }
    .axis-patent-block .pt-meta .pt-granted { color: #00ffb8; }
    .axis-patent-block .pt-meta .pt-pending { color: #88ccff; }
    .axis-patent-block .pt-name { color: #ffffff; }
    .axis-patent-block .pt-brief {
      border-top: 1px solid rgba(224, 102, 255, 0.42);
      font-size: 11.5px;
      line-height: 1.38;
      color: var(--text-muted);
      font-weight: 600;
    }
    .axis-patent-block.layer-tech { border-color: rgba(224, 102, 255, 0.75); }
    .axis-patent-block.layer-proto { border-color: rgba(240, 180, 255, 0.72); }
    .axis-patent-block.layer-gov { border-color: rgba(0, 255, 184, 0.72); }
    .axis-patent-block.layer-gov .pt-meta { color: #00ffb8; }

    html.topology-embed { min-height: 0; height: auto; overflow: visible; background: transparent; }
    body.topology-embed { min-height: 0; height: auto; overflow: visible; background: transparent; }
    body.topology-embed .stars { display: none; }
    body.topology-embed header,
    body.topology-embed .legend { display: none; }
    body.topology-embed .page { max-width: none; padding: 0; margin: 0; }
    body.topology-embed .mega-wrap {
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: transparent;
      padding: 0;
    }
    /* 嵌入主页与独立页共用同一套字号 */
    body.topology-embed .cap-card { padding: 10px 14px; font-size: 15.5px; line-height: 1.5; }
    body.topology-embed .layer-head-title { font-size: 22px; }
    body.topology-embed .layer-head-body { font-size: 13px; }
    body.topology-embed .ind-pill { font-size: 15px; }
    body.topology-embed .ind-pill .ind-sub { font-size: 13px; }
    body.topology-embed .intel-pill { font-size: 14.5px; padding: 8px 12px; }
    body.topology-embed {
      --topology-card-h: 130px;
      --topology-card-pad: 10px 11px 9px;
    }
    body.topology-embed .paper-badge-wrap,
    body.topology-embed .axis-paper-block,
    body.topology-embed .axis-standard-block,
    body.topology-embed .axis-patent-block { max-width: 100%; }
  </style>
</head>
<body>
  <script>
    (function () {
      if (/[?&]embed=1(?:&|$)/.test(location.search)) {
        document.documentElement.classList.add('topology-embed');
        document.body.classList.add('topology-embed');
      }
    })();
  </script>
  <div class="stars" aria-hidden="true"></div>
  <div class="page">
    <header>
      <h1 data-i18n="hdrTitle">AI 可信基础设施架构图谱</h1>
      <p class="sub" data-i18n="hdrSub">浙江大学滨江研究院 · 数智融合研究中心（IFRC）— 四层可信基础设施架构；展示论文、参与标准与相关专利（不含发明人）</p>
    </header>

    <div class="legend" aria-hidden="true">
      <span><i class="l-stack"></i> <span data-i18n="legStack">四层纵向协同（场景 → 技术 → 协议 → 治理）</span></span>
      <span><i class="l-gov"></i> <span data-i18n="legGov">治理层全链路合规审计与证据链反馈</span></span>
      <span><i class="l-paper"></i> <span data-i18n="legPaper">论文标签：发表信息 · 论文全称 · 贡献要点（悬停看补充说明）</span></span>
      <span><i class="l-standard"></i> <span data-i18n="legStandard">参与标准：级别 · 状态 · 标准名称 · 合作单位</span></span>
      <span><i class="l-patent"></i> <span data-i18n="legPatent">相关专利：类型 · 状态 · 专利名称 · 技术要点</span></span>
    </div>

    <div class="mega-wrap" id="mega">
      <svg class="graph-svg" viewBox="0 0 1680 2460" xmlns="http://www.w3.org/2000/svg" aria-label="AI 可信基础设施四层架构图">
        <defs>
          <linearGradient id="gCore" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00ffff"/>
            <stop offset="50%" stop-color="#e066ff"/>
            <stop offset="100%" stop-color="#00ffb8"/>
          </linearGradient>
          <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- 核心定位 -->
        <rect x="80" y="10" width="1520" height="132" rx="14" fill="rgba(4,12,32,0.94)" stroke="url(#gCore)" stroke-width="2.5" filter="url(#glowCyan)"/>
        <text x="840" y="42" text-anchor="middle" fill="url(#gCore)" font-size="22" font-weight="900" data-i18n="coreTitle">构建「场景 — 技术 — 治理」三位一体的 AI 可信基础设施</text>
        <text x="840" y="68" text-anchor="middle" fill="#dcecff" font-size="15.5" font-weight="600" data-i18n="coreSub">协议层贯通跨域信任与工具链安全，治理层提供全链路合规审计与证据链底座</text>
        <foreignObject x="255" y="86" width="210" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="intel-pill" data-i18n="intelGen">生成智能</div></foreignObject>
        <foreignObject x="485" y="86" width="210" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="intel-pill" data-i18n="intelAgent">代理智能</div></foreignObject>
        <foreignObject x="715" y="86" width="210" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="intel-pill" data-i18n="intelEmb">具身智能</div></foreignObject>
        <foreignObject x="945" y="86" width="210" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="intel-pill" data-i18n="intelPer">感知智能</div></foreignObject>
        <g transform="translate(1475, 28)">
          <circle cx="0" cy="48" r="32" fill="rgba(255,221,87,0.2)" stroke="#ffdd57" stroke-width="2"/>
          <text x="0" y="42" text-anchor="middle" fill="#ffdd57" font-size="12" font-weight="900" data-i18n="triScene">场景</text>
          <text x="0" y="56" text-anchor="middle" fill="#ffdd57" font-size="12" font-weight="900" data-i18n="triTech">技术</text>
          <text x="0" y="70" text-anchor="middle" fill="#ffdd57" font-size="12" font-weight="900" data-i18n="triGov">治理</text>
        </g>

        <!-- ========== 场景层 ========== -->
        <g id="layer-bundle-0" class="layer-bundle" transform="translate(0,158)">
          <rect id="layer-bg-0" x="80" y="0" width="1520" height="480" rx="14" fill="rgba(4,12,32,0.9)" stroke="rgba(0,255,255,0.72)" stroke-width="2"/>
          <foreignObject x="100" y="4" width="1480" height="76">
            <div xmlns="http://www.w3.org/1999/xhtml" class="layer-head layer-head-scene">
              <p class="layer-head-title" data-i18n="sTit">场景层：关键领域 AI 应用可信治理</p>
              <p class="layer-head-body"><span class="layer-head-lead" data-i18n="sSub">金融 · 能源 · 教育 · 医疗 · 汽车 · 政务等行业场景化可信应用与评估管控</span><span class="lh-item"><span class="cap-line-num">①</span><span data-i18n="sI1">面向教育、金融、医疗、能源等重点行业</span></span><span class="lh-item"><span class="cap-line-num">②</span><span data-i18n="sI2">构建场景化 AI 可信应用范式与规范体系</span></span><span class="lh-item"><span class="cap-line-num">③</span><span data-i18n="sI3">建立行业专属的可信评估与管控机制</span></span></p>
            </div>
          </foreignObject>
          <text x="840" y="88" text-anchor="middle" fill="#00ffff" font-size="15" font-weight="700" data-i18n="worksLabel">论文 · 标准 · 专利</text>
          <g id="papers-scenario" transform="translate(100,100)"></g>
        </g>

        <!-- ========== 技术层 ========== -->
        <g id="layer-bundle-1" class="layer-bundle" transform="translate(0,620)">

      }

      function restackLayerFlow(job) {
        var cfg = job.cfg;
        var items = job.items;
        var grid = flowGridOrigin(cfg);
        var colYs = [];
        var colLastType = [];
        var c;
        for (c = 0; c < grid.cols; c++) {
          colYs[c] = 0;
          colLastType[c] = null;
        }

        items.forEach(function (it) {
          var pick = 0;
          for (c = 1; c < grid.cols; c++) {
            if (colYs[c] < colYs[pick]) pick = c;
          }
          var y = colYs[pick];
          if (colLastType[pick] && it.type !== colLastType[pick]) y += TYPE_GAP;
          it.fo.setAttribute('x', String(Math.round(grid.startX + pick * (grid.cardW + grid.gap))));
          it.fo.setAttribute('y', String(Math.round(y)));
          it.fo.setAttribute('width', String(Math.round(grid.cardW)));
          var h = foHeight(it.fo);
          colYs[pick] = y + h + ITEM_GAP;
          colLastType[pick] = it.type;
        });

        var maxY = 0;
        for (c = 0; c < grid.cols; c++) maxY = Math.max(maxY, colYs[c]);
        return maxY;
      }

      function measureHost(host) {
        var maxB = 0;
        host.querySelectorAll('foreignObject').forEach(function (fo) {
          var y = parseFloat(fo.getAttribute('y')) || 0;
          var h = syncFoHeight(fo);
          maxB = Math.max(maxB, y + h);
        });
        return maxB;
      }

      function reflowLayerBundles() {
        var svg = document.querySelector('.graph-svg');
        var y = FIRST_LAYER_Y;
        for (var L = 0; L < 4; L++) {
          var meta = LAYER_LAYOUT[L];
          var bundle = document.getElementById(meta.bundleId);
          var bg = document.getElementById(meta.bgId);
          var host = document.getElementById(meta.hostId);
          if (bundle) bundle.setAttribute('transform', 'translate(0,' + y + ')');
          var contentH = host ? Math.max(measureHost(host), 28) : 28;
          var layerH = meta.paperOffset + contentH + LAYER_BOTTOM_PAD;
          if (bg) bg.setAttribute('height', String(Math.ceil(layerH)));
          y += layerH + LAYER_GAP;
        }
        var fb = document.getElementById('graph-feedback');
        if (fb) fb.setAttribute('y', String(Math.ceil(y + 24)));
        layoutSvgHeight = Math.ceil(y + 96);
        if (svg) svg.setAttribute('viewBox', '0 0 ' + SVG_W + ' ' + layoutSvgHeight);
      }

      var layoutSvgHeight = 2460;
      var EMBED_HEIGHT_PAD = 72;

      function computeEmbedHeight() {
        var svg = document.querySelector('.graph-svg');
        var mega = document.getElementById('mega');
        if (!svg || !mega) return 0;
        /* 测量前解除固定高度，避免低估后裁切 → 再测更小 → 恶性循环 */
        if (embed) {
          document.documentElement.style.height = '';
          document.body.style.minHeight = '';
        }
        var megaRect = mega.getBoundingClientRect();
        var cs = window.getComputedStyle(mega);
        var padV = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
        var megaW = megaRect.width || mega.clientWidth || SVG_W;
        var vb = svg.viewBox.baseVal;
        var vbH = (vb && vb.height > 0) ? vb.height : layoutSvgHeight;
        /* 嵌入主页：以布局后的 viewBox 换算像素高度，不依赖可能被 iframe 裁切后的 DOM 测量 */
        var layoutPx = Math.ceil((vbH / SVG_W) * megaW) + padV;
        if (embed) {
          return layoutPx + EMBED_HEIGHT_PAD;
        }
        var svgRect = svg.getBoundingClientRect();
        var h = (vb && vb.width > 0 && svgRect.width > 0)
          ? Math.ceil((vb.height / vb.width) * svgRect.width) + padV
          : Math.ceil(megaRect.height);
        var maxBottom = 0;
        svg.querySelectorAll('foreignObject').forEach(function (fo) {
          var r = fo.getBoundingClientRect();
          maxBottom = Math.max(maxBottom, r.bottom - megaRect.top);
        });
        var fb = document.getElementById('graph-feedback');
        if (fb) {
          var fbRect = fb.getBoundingClientRect();
          maxBottom = Math.max(maxBottom, fbRect.bottom - megaRect.top);
        }
        return Math.max(h, layoutPx, Math.ceil(maxBottom)) + EMBED_HEIGHT_PAD;
      }

      function applyEmbedDocumentHeight(h) {
        if (!embed || h < 400) return;
        document.body.style.minHeight = h + 'px';
      }

      function finalizeLayout() {
        /* 先设宽度并同步高度，再堆叠；跑两轮以消化换行后的真实高度 */
        for (var pass = 0; pass < 2; pass++) {
          layerLayoutJobs.forEach(function (job) {
            restackLayerFlow(job);
          });
        }
        reflowLayerBundles();
        notifyParentHeight();
      }

      function appendPaperFo(host, p, box) {
        var fo = document.createElementNS(SVG_NS, 'foreignObject');
        fo.setAttribute('overflow', 'hidden');
        fo.setAttribute('x', String(Math.round(box.x)));
        fo.setAttribute('y', String(Math.round(box.y)));
        fo.setAttribute('width', String(Math.round(box.w)));
        fo.setAttribute('height', String(Math.round(box.h)));

        var wrap = document.createElementNS(XHTML_NS, 'div');
        wrap.setAttribute('xmlns', XHTML_NS);
        wrap.className = 'paper-badge-wrap';

        var div = document.createElementNS(XHTML_NS, 'div');
        var cls = paperLayerClass(p.layer);
        div.className = 'axis-paper-block' + (cls ? ' ' + cls : '');

        var pv = document.createElementNS(XHTML_NS, 'span');
        pv.className = 'pv';
        pv.textContent = p.venue;
        var tit = document.createElementNS(XHTML_NS, 'span');
        tit.className = 'paper-title';
        tit.textContent = paperDisplayTitle(p);
        div.appendChild(pv);
        div.appendChild(tit);
        var br = document.createElementNS(XHTML_NS, 'span');
        br.className = 'paper-brief topology-card-footer';
        br.textContent = p.brief || '';
        div.appendChild(br);

        wrap.appendChild(div);
        var slot = document.createElementNS(XHTML_NS, 'div');
        slot.setAttribute('xmlns', XHTML_NS);
        slot.className = 'topology-card-slot';
        slot.appendChild(wrap);
        fo.appendChild(slot);
        host.appendChild(fo);

        return fo;
      }

      function appendStandardFo(host, s, box) {
        var fo = document.createElementNS(SVG_NS, 'foreignObject');
        fo.setAttribute('overflow', 'hidden');
        fo.setAttribute('x', String(Math.round(box.x)));
        fo.setAttribute('y', String(Math.round(box.y)));
        fo.setAttribute('width', String(Math.round(box.w)));
        fo.setAttribute('height', String(Math.round(box.h)));

        var wrap = document.createElementNS(XHTML_NS, 'div');
        wrap.setAttribute('xmlns', XHTML_NS);
        wrap.className = 'paper-badge-wrap';

        var div = document.createElementNS(XHTML_NS, 'div');
        var cls = paperLayerClass(s.layer);
        div.className = 'axis-standard-block' + (cls ? ' ' + cls : '');

        var meta = document.createElementNS(XHTML_NS, 'span');
        meta.className = 'st-meta';
        meta.innerHTML = s.level + ' · <span class="st-status ' + standardStatusClass(s.status) + '">' + s.status + '</span>';

        var name = document.createElementNS(XHTML_NS, 'span');
        name.className = 'st-name';
        name.textContent = s.name;

        var partner = document.createElementNS(XHTML_NS, 'span');
        partner.className = 'st-partner topology-card-footer';
        partner.textContent = s.partner;

        div.appendChild(meta);
        div.appendChild(name);
        div.appendChild(partner);

        wrap.appendChild(div);
        var slot = document.createElementNS(XHTML_NS, 'div');
        slot.setAttribute('xmlns', XHTML_NS);
        slot.className = 'topology-card-slot';
        slot.appendChild(wrap);
        fo.appendChild(slot);
        host.appendChild(fo);

        return fo;
      }

      function appendPatentFo(host, p, box) {
        var fo = document.createElementNS(SVG_NS, 'foreignObject');
        fo.setAttribute('overflow', 'hidden');
        fo.setAttribute('x', String(Math.round(box.x)));
        fo.setAttribute('y', String(Math.round(box.y)));
        fo.setAttribute('width', String(Math.round(box.w)));
        fo.setAttribute('height', String(Math.round(box.h)));

        var wrap = document.createElementNS(XHTML_NS, 'div');
        wrap.setAttribute('xmlns', XHTML_NS);
        wrap.className = 'paper-badge-wrap';

        var div = document.createElementNS(XHTML_NS, 'div');
        var cls = paperLayerClass(p.layer);
        div.className = 'axis-patent-block' + (cls ? ' ' + cls : '');

        var meta = document.createElementNS(XHTML_NS, 'span');
        meta.className = 'pt-meta';
        meta.innerHTML = p.kind + ' · <span class="pt-status ' + patentStatusClass(p.status) + '">' + patentStatusLabel(p.status) + '</span>';

        var name = document.createElementNS(XHTML_NS, 'span');
        name.className = 'pt-name';
        name.textContent = p.name;

        div.appendChild(meta);
        div.appendChild(name);
        var pbr = document.createElementNS(XHTML_NS, 'span');
        pbr.className = 'pt-brief topology-card-footer';
        pbr.textContent = p.brief || '';
        div.appendChild(pbr);

        wrap.appendChild(div);
        var slot = document.createElementNS(XHTML_NS, 'div');
        slot.setAttribute('xmlns', XHTML_NS);
        slot.className = 'topology-card-slot';
        slot.appendChild(wrap);
        fo.appendChild(slot);
        host.appendChild(fo);

        return fo;
      }

      var patents = (typeof TOPOLOGY_PATENTS !== 'undefined' && TOPOLOGY_PATENTS) ? TOPOLOGY_PATENTS : [];

      var paperBuckets = {};
      var standardBuckets = {};
      var patentBuckets = {};
      papers.forEach(function (p) {
        var k = p.layer + ':' + p.lane;
        if (!paperBuckets[k]) paperBuckets[k] = [];
        paperBuckets[k].push(p);
      });
      standards.forEach(function (s) {
        var k = s.layer + ':' + s.lane;
        if (!standardBuckets[k]) standardBuckets[k] = [];
        standardBuckets[k].push(s);
      });
      patents.forEach(function (p) {
        var k = p.layer + ':' + p.lane;
        if (!patentBuckets[k]) patentBuckets[k] = [];
        patentBuckets[k].push(p);
      });

      applyLayerChrome();

      for (var layerIdx = 0; layerIdx < 4; layerIdx++) {
        var layerCfg = LAYER_LAYOUT[layerIdx];
        var layerHost = document.getElementById(layerCfg.hostId);
        if (!layerHost) continue;
        var layerBucket = layerBucketItems(layerIdx);
        if (!layerBucket.plist.length && !layerBucket.slist.length && !layerBucket.ptlist.length) continue;
        renderLayerGroup(layerHost, layerCfg, layerIdx);
      }

      var megaEl = document.getElementById('mega');
      function notifyParentHeight() {
        if (!embed || !megaEl || !window.parent || window.parent === window) return;
        var h = computeEmbedHeight();
        if (h < 400) return;
        applyEmbedDocumentHeight(h);
        try {
          window.parent.postMessage({ type: 'ifrc-topology-height', height: h }, '*');
        } catch (e) { /* ignore */ }
      }

      function scheduleFinalizeLayout() {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              finalizeLayout();
              setTimeout(notifyParentHeight, 120);
              setTimeout(notifyParentHeight, 400);
              setTimeout(notifyParentHeight, 900);
              setTimeout(notifyParentHeight, 1600);
            });
          });
        });
      }
      scheduleFinalizeLayout();
      window.addEventListener('load', scheduleFinalizeLayout);
      window.addEventListener('resize', function () {
        if (embed) notifyParentHeight();
      });
      window.addEventListener('message', function (ev) {
        if (!embed || !ev.data || ev.data.type !== 'ifrc-topology-request-height') return;
        notifyParentHeight();
      });
      if (typeof ResizeObserver !== 'undefined' && megaEl) {
        new ResizeObserver(function () {
          if (embed) notifyParentHeight();
        }).observe(megaEl);
      }

      if (!embed) {
        for (var i = 0; i < 24; i++) {
          var d = document.createElement('div');
          d.setAttribute('aria-hidden', 'true');
          d.style.cssText = 'position:fixed;width:2px;height:2px;border-radius:50%;pointer-events:none;z-index:0;opacity:.45;' +
            'left:' + Math.random() * 100 + '%;top:' + Math.random() * 100 + '%;' +
            'background:' + (Math.random() > 0.5 ? 'rgba(0,229,255,0.45)' : 'rgba(191,0,255,0.35)') + ';' +
            'animation:twinkle ' + (6 + Math.random() * 8) + 's ease-in-out infinite;' +
            'animation-delay:' + (-Math.random() * 8) + 's';
          document.body.appendChild(d);
        }
      }
    })();
  </script>
